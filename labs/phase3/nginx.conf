upstream api_canary {
    # カナリアデプロイの重み付け
    # v1（安定版）: 90%、v2（新バージョン）: 10%
    server api-v1:8080 weight=9;
    server api-v2:8080 weight=1;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_canary;
        proxy_set_header Host $host;
        add_header X-Upstream $upstream_addr;
    }
}
