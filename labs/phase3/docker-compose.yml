services:
  # ロードバランサ（カナリア制御）
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      - V1_WEIGHT=${V1_WEIGHT:-9}
      - V2_WEIGHT=${V2_WEIGHT:-1}
    depends_on:
      - api-v1
      - api-v2

  # 安定版（デフォルト90%のトラフィック）
  api-v1:
    build: ./services/api-v1

  # 新バージョン・カナリア（デフォルト10%のトラフィック）
  api-v2:
    build: ./services/api-v2
