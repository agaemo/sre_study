services:
  frontend:
    build: ./services/frontend
    ports:
      - "8080:8080"
    environment:
      - BACKEND_URL=http://backend:8081
    depends_on:
      - backend

  # USE_CIRCUIT_BREAKER=false でカスケード障害を観察
  # USE_CIRCUIT_BREAKER=true でサーキットブレーカーの効果を確認
  backend:
    build: ./services/backend
    environment:
      - DB_URL=http://database:8082
      - USE_CIRCUIT_BREAKER=${USE_CIRCUIT_BREAKER:-false}
    depends_on:
      - database

  database:
    build: ./services/database
